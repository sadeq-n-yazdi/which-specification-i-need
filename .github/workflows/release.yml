name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    # The macOS collector uses cgo with system frameworks, so it must be built on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build release bundles
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            name="mac-performance-logger-${VERSION}-darwin-${arch}"
            mkdir -p "dist/${name}/bin" "dist/${name}/report"
            GOOS=darwin GOARCH="${arch}" CGO_ENABLED=1 \
              go build -trimpath -ldflags "-s -w" -o "dist/${name}/bin/mac-performance-logger" .
            cp Makefile README.md HOWTO.md LICENSE REPORT_INSTRUCTIONS.md logger.conf.sample \
              launchd.plist.template "dist/${name}/"
            cp report/make_*.py "dist/${name}/report/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-macos
          path: dist/*.tar.gz

  build-linux:
    # The Linux collector is pure Go, so both architectures are cross-built on one runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build release bundles
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            name="mac-performance-logger-${VERSION}-linux-${arch}"
            mkdir -p "dist/${name}/bin" "dist/${name}/report"
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o "dist/${name}/bin/mac-performance-logger" .
            cp Makefile README.md HOWTO.md LICENSE REPORT_INSTRUCTIONS.md logger.conf.sample \
              systemd.service.template "dist/${name}/"
            cp report/make_*.py "dist/${name}/report/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-linux
          path: dist/*.tar.gz

  publish:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
